workflows:
  android-build:
    name: Qarqoush APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Generate Gradle Wrapper
        script: |
          set -e
          mkdir -p /tmp/gradle-wrapper
          cd /tmp/gradle-wrapper
          touch build.gradle
          gradle wrapper --gradle-version 9.3.1
          cp gradlew "$CM_BUILD_DIR/"
          mkdir -p "$CM_BUILD_DIR/gradle/wrapper"
          cp gradle/wrapper/* "$CM_BUILD_DIR/gradle/wrapper/"

      - name: Prepare Android
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          chmod +x gradlew

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          echo "Generating Debug Keystore..."

          rm -f "$CM_BUILD_DIR/debug.keystore"

          keytool -genkeypair -noprompt -v \
            -keystore "$CM_BUILD_DIR/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Checking Keystore..."

          ls -l "$CM_BUILD_DIR/debug.keystore"

          test -f "$CM_BUILD_DIR/debug.keystore"

          echo "Keystore successfully generated!"

      - name: Verify Signing File
        script: |
          set -e

          echo "Checking project root:"
          ls -la "$CM_BUILD_DIR"

          test -f "$CM_BUILD_DIR/debug.keystore"

          echo "Signing file exists."

      - name: Build APK
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          ./gradlew assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/*.apk